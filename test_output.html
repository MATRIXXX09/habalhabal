<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Habal Habal Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><text y=%221.2em%22 font-size=%2296%22>⚫️</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.7/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.7/js/dataTables.min.js"></script>

        
        </head>
<body class="h-full">
    <!-- Account Disabled Modal Notification -->
    <!-- ELSE: Account is ENABLED - Show Normal Login Form -->

<div class="min-h-screen bg-gray-900 py-12 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
    <div class="w-full max-w-md space-y-8">
        <!-- Header -->
        <div class="flex justify-center">
            <img class="h-12 w-auto" src="/images/HABAL.png" alt="Habal-habal">
        </div>

        <div>
            <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-white">
                Sign in to your account
            </h2>
            <p class="mt-2 text-center text-sm text-gray-400">
                Habal Habal Fleet Management System
            </p>
        </div>

        <!-- Error Message -->
        
        <!-- Login Form -->
        <form class="mt-8 space-y-6" action="/login" method="post">
            <div class="rounded-lg bg-gray-800 p-6 space-y-4">
                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email address
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        value=""
                        required 
                        autofocus
                        class="block w-full rounded-md bg-gray-700 px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800"
                        placeholder="user@example.com"
                    >
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        required
                        class="block w-full rounded-md bg-gray-700 px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800"
                        placeholder="••••••••"
                    >
                </div>

                <!-- CSRF Token -->
                <input type="hidden" name="_csrf_token" value="csrf-token">

                <!-- Terms and Conditions -->
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        name="agree_terms" 
                        id="agree_terms"
                        required
                        class="h-4 w-4 rounded border-gray-600 bg-gray-700 text-indigo-500 focus:ring-indigo-500"
                    >
                    <label for="agree_terms" class="ml-2 block text-sm text-gray-400">
                        I agree to the terms and conditions
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full rounded-md bg-indigo-500 py-2 px-4 text-sm font-semibold text-white hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition-colors"
                >
                    Sign in
                </button>
            </div>
        </form>

        <!-- Register Link -->
        <div class="rounded-lg bg-gray-800 p-4 border border-gray-700 text-center text-sm text-gray-400">
            <p>Don't have an account? <a href="/register" class="text-indigo-400 hover:underline">Register here</a></p>
        </div>
    </div>
</div>
</body>
</html>
